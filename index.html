<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New York 2026 · putni pratilac</title>
<meta name="theme-color" content="#0E1A2B">
<meta name="description" content="Putni pratilac za New York, 5. – 14. 12. 2026: plan po danima, troškovi i popisi.">

<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --navy:#0E1A2B; --navy2:#1B2A40; --gold:#C9A15B; --gold-d:#7A5C24; --slate:#4A5566;
  --cream:#F3F4F6; --paper:#FFFFFF; --line:#E5E7EB; --line2:#D1D5DB; --ok:#4E7A55; --bad:#A4473A;
  --serif:'Bodoni Moda',Georgia,serif; --sans:'Jost',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#FFFFFF;color:var(--navy);font-family:var(--sans);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold-d)}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:92px;position:relative}
header.top{background:var(--navy);color:var(--cream);padding:18px 20px 16px;position:relative;overflow:hidden}
header.top:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border:1px solid rgba(201,161,91,.35);border-radius:50%}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0}
h1{font-size:34px;line-height:1.05}
h1 i{color:var(--gold)}
h2{font-size:24px;line-height:1.15}
h3{font-size:18px}
.clocks{display:flex;gap:18px;margin-top:12px;font-size:13px;color:#C9CFD8}
.clocks b{color:#fff;font-weight:500;font-size:15px;margin-left:4px}
main{padding:16px 16px 8px}
.card{background:var(--paper);border:1px solid var(--line);box-shadow:0 1px 3px rgba(14,26,43,.06);border-radius:14px;padding:16px;margin-bottom:14px}
.card.dark{background:var(--navy);color:var(--cream);border-color:var(--navy)}
.card.dark .muted{color:#AEB6C2}
.muted{color:var(--slate);font-size:14px}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.gold{color:var(--gold-d)}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--cream);border:1px solid var(--line);color:var(--slate)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--gold);background:transparent;color:var(--gold-d);padding:10px 14px;border-radius:10px;font-weight:500;text-decoration:none;font-size:15px}
.btn.solid{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.btn.navy{background:var(--navy);color:var(--cream);border-color:var(--navy)}
.btn.block{width:100%}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.dark .btn{color:var(--gold);border-color:var(--gold)}
.dark .btn.solid{color:var(--navy)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--navy);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;background:none;border:0;color:#9AA4B2;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;letter-spacing:.04em}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
nav.tabs button.on{color:var(--gold)}
/* timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.tl li:first-child{border-top:0}
.tl .time{width:62px;flex:none;font-size:13px;color:var(--gold-d);font-weight:500;padding-top:2px}
.tl .txt{flex:1;min-width:0}
.tl .txt small{display:block;color:var(--slate);font-size:13px;margin-top:2px}
.tl li.past .txt,.tl li.past .time{opacity:.5}
.tl li.now{background:linear-gradient(90deg,rgba(201,161,91,.16),transparent);margin:0 -16px;padding-left:16px;padding-right:16px}
.tl li.now .time:after{content:"sada";display:block;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold-d);margin-top:2px}
.chk{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);background:#fff;flex:none;display:flex;align-items:center;justify-content:center;padding:0}
.chk svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.chk.on{background:var(--gold);border-color:var(--gold)}
.chk.on svg{opacity:1}
.done .txt b,.done .txt span.t{text-decoration:line-through;color:var(--slate)}
/* day chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line2);background:var(--paper);border-radius:12px;padding:7px 11px;text-align:center;min-width:56px;color:var(--navy)}
.chip small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate)}
.chip b{font-weight:500;font-size:15px}
.chip.on{background:var(--navy);color:var(--cream);border-color:var(--navy)}
.chip.on small{color:var(--gold)}
.chip.today{box-shadow:inset 0 -3px 0 var(--gold)}
.daynum{font-family:var(--serif);font-size:48px;line-height:1;color:var(--gold)}
.place{padding:10px 0;border-top:1px solid var(--line)}
.place:first-child{border-top:0;padding-top:0}
.place b{font-weight:500}
.place p{margin:3px 0 0;font-size:14px;color:var(--slate)}
.tip{background:#FBF7EF;border-left:3px solid var(--gold);padding:10px 12px;border-radius:0 10px 10px 0;font-size:14px;margin:10px 0}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.facts div{background:var(--cream);border-radius:10px;padding:8px;text-align:center}
.facts b{display:block;font-family:var(--serif);font-size:18px;font-weight:400;color:var(--gold-d)}
.facts span{font-size:11px;color:var(--slate)}
.sec-title{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-d);margin:18px 2px 8px}
/* expenses */
.big{font-family:var(--serif);font-size:38px;line-height:1}
.bar{height:8px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden}
.card:not(.dark) .bar{background:var(--line)}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.bar i.over{background:var(--bad)}
.cat-row{margin:10px 0}
.cat-row .row{font-size:14px;margin-bottom:4px}
.exp{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.exp:first-of-type{border-top:0}
.ico{width:38px;height:38px;border-radius:10px;background:var(--cream);display:flex;align-items:center;justify-content:center;flex:none;font-size:18px}
.thumb{width:38px;height:38px;border-radius:8px;object-fit:cover;flex:none;border:1px solid var(--line)}
.amt{text-align:right;white-space:nowrap}
.amt b{font-weight:500;display:block}
.amt small{color:var(--slate);font-size:12px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:84px;width:58px;height:58px;border-radius:50%;background:var(--gold);color:var(--navy);border:0;box-shadow:0 6px 18px rgba(14,26,43,.3);font-size:30px;line-height:1;z-index:15}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(14,26,43,.55);z-index:40;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet .handle{width:40px;height:4px;background:var(--line2);border-radius:4px;margin:-6px auto 12px}
label.f{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);margin:14px 0 6px}
.inp{width:100%;border:1px solid var(--line2);background:#fff;border-radius:10px;padding:11px 12px;font-size:16px}
.amount-inp{font-family:var(--serif);font-size:30px;padding:8px 12px}
.seg{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#fff}
.seg button{flex:1;border:0;background:none;padding:9px 6px;font-size:14px}
.seg button.on{background:var(--navy);color:var(--cream)}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.catgrid button{border:1px solid var(--line2);background:#fff;border-radius:10px;padding:9px 4px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
.catgrid button span{font-size:20px}
.catgrid button.on{border-color:var(--gold);background:#FBF7EF;box-shadow:inset 0 0 0 1px var(--gold)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.photo-prev{margin-top:10px;position:relative}
.photo-prev img{width:100%;max-height:260px;object-fit:contain;border-radius:10px;background:var(--cream);border:1px solid var(--line)}
.photo-prev button{position:absolute;top:8px;right:8px}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px}
.viewer.open{display:flex}
.viewer img{max-width:100%;max-height:82vh;border-radius:6px}
.viewer button{margin-top:14px}
/* lists */
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow small{display:block;color:var(--slate);font-size:12px}
.li .x{background:none;border:0;color:var(--line2);font-size:20px;padding:0 4px}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow .inp{padding:9px 11px;font-size:15px}
.progress{font-size:13px;color:var(--slate)}
.banner{background:#FBF7EF;border:1px solid var(--line);color:var(--gold-d);font-size:13px;padding:8px 12px;border-radius:10px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--navy);color:var(--cream);padding:10px 16px;border-radius:99px;font-size:14px;z-index:70;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--slate)}
.kv dd{margin:0}
.flight{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.flight:first-of-type{border-top:0}
.flight .t{font-family:var(--serif);font-size:20px}
.flight .ln{flex:1;height:1px;background:var(--line2);position:relative}
.flight .ln:after{content:"✈";position:absolute;left:50%;top:-10px;transform:translateX(-50%);font-size:13px;color:var(--gold-d);background:var(--paper);padding:0 4px}
.empty{text-align:center;color:var(--slate);padding:18px 8px;font-size:14px}
.opt{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;background:#fff}
.opt b{font-weight:500}
.opt p{margin:3px 0 0;font-size:14px;color:var(--slate)}
.countdown{display:flex;gap:10px;margin-top:12px}
.countdown div{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(201,161,91,.3);border-radius:10px;padding:8px 4px;text-align:center}
.countdown b{display:block;font-family:var(--serif);font-size:28px;font-weight:400;color:var(--gold)}
.countdown span{font-size:11px;color:#AEB6C2;letter-spacing:.08em}
.hidden{display:none!important}
</style>
</head>

function tzParts(tz){
  const p = new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
  const o = {}; p.forEach(x => o[x.type] = x.value);
  return {date:`${o.year}-${o.month}-${o.day}`, h:+o.hour + (+o.minute)/60, hm:`${o.hour}:${o.minute}`};
}
function tripKey(){
  const zg = tzParts("Europe/Zagreb"), ny = tzParts("America/New_York");
  if (zg.date < "2026-12-05") return {k:"pre", zg, ny};
  if (zg.date > "2026-12-14") return {k:"post", zg, ny};
  if (zg.date === "2026-12-05" || zg.date === "2026-12-14") return {k:zg.date, zg, ny, h:zg.h};
  if (ny.date >= "2026-12-06" && ny.date <= "2026-12-13") return {k:ny.date, zg, ny, h:ny.h};
  return {k:ny.date < "2026-12-06" ? "2026-12-05" : "2026-12-14", zg, ny, h:zg.h};
}

/* ---- slike računa u IndexedDB ---- */
const IDB = {
  db:null,
  open(){
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open("nyc26", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("receipts");
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async tx(mode, fn){ const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction("receipts", mode); const st = t.objectStore("receipts"); const out = fn(st); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); },
  put(id, blob){ return this.tx("readwrite", st => st.put(blob, id)); },
  get(id){ return this.tx("readonly", st => st.get(id)); },
  del(id){ return this.tx("readwrite", st => st.delete(id)); },
  async all(){ const db = await this.open(); return new Promise((res, rej) => { const out = {}; const t = db.transaction("receipts","readonly"); const c = t.objectStore("receipts").openCursor(); c.onsuccess = () => { const cur = c.result; if (cur){ out[cur.key] = cur.value; cur.continue(); } }; t.oncomplete = () => res(out); t.onerror = () => rej(t.error); }); }
};
const URLS = {};
async function loadReceipts(){
  const ids = Object.values(S.expenses).map(e => e.receipt && e.receipt.local).filter(Boolean);
  let changed = false;
  for (const id of ids){
    if (URLS[id]) continue;
    try { const b = await IDB.get(id); if (b){ URLS[id] = URL.createObjectURL(b); changed = true; } } catch(e){ console.warn(e); }
  }
  if (changed) render();
}
function removeReceipt(r){ if (r && r.local){ IDB.del(r.local).catch(()=>{}); if (URLS[r.local]){ URL.revokeObjectURL(URLS[r.local]); delete URLS[r.local]; } } }

/* ---- sigurnosna kopija ---- */
const blobToData = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(b); });
const dataToBlob = d => fetch(d).then(r => r.blob());
async function exportBackup(){
  const receipts = {};
  try { const all = await IDB.all(); for (const [k,b] of Object.entries(all)) receipts[k] = await blobToData(b); } catch(e){ console.warn(e); }
  const data = {app:"nyc26", v:1, exported:new Date().toISOString(), name:S.name, expenses:S.expenses, shopping:S.shopping, checks:S.checks, items:S.items, settings:S.settings, receipts};
  const blob = new Blob([JSON.stringify(data)], {type:"application/json"});
  const fname = `newyork-kopija-${new Date().toISOString().slice(0,10)}.json`;
  const file = new File([blob], fname, {type:"application/json"});
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file], title:"New York – sigurnosna kopija"}); LS.set("lastBackup", Date.now()); render(); return; } catch(e){ if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fname; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  LS.set("lastBackup", Date.now()); toast("Kopija je preuzeta"); render();
}
async function importBackup(file){
  try{
    const d = JSON.parse(await file.text());
    if (d.app !== "nyc26") throw new Error("format");
    for (const [k,v] of Object.entries(d.receipts || {})) await IDB.put(k, await dataToBlob(v));
    ["expenses","shopping","checks","items"].forEach(c => { S[c] = Object.assign({}, S[c], d[c] || {}); persist(c); });
    if (d.settings) saveSettings(d.settings);
    if (!S.name && d.name){ S.name = d.name; LS.set("name", S.name); }
    await loadReceipts(); render(); toast("Kopija je vraćena");
  }catch(e){ console.warn(e); toast("Ovo nije ispravna datoteka kopije."); }
}

function loadImg(file){
  return new Promise((res, rej) => { const u = URL.createObjectURL(file); const i = new Image(); i.onload = () => { res(i); }; i.onerror = () => rej(new Error("img")); i.src = u; });
}
async function compress(file, max, q){
  const img = await loadImg(file);
  const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*sc); c.height = Math.round(img.naturalHeight*sc);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(img.src);
  return await new Promise(r => c.toBlob(r, "image/jpeg", q));
}
async function storeReceipt(file){
  const blob = await compress(file, 1600, 0.75);
  const id = "r" + uid();
  await IDB.put(id, blob);
  URLS[id] = URL.createObjectURL(blob);
  return {local:id};
}
const receiptSrc = r => r ? (r.local ? (URLS[r.local] || "") : (r.data || "")) : "";

function setTab(t){ tab = t; if (location.hash !== "#"+t) history.replaceState(null, "", "#"+t); window.scrollTo(0,0); render(); }
window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (["danas","plan","troskovi","popisi","info"].includes(t) && t !== tab){ tab = t; render(); } });

function expEur(e){ return e.cur === "EUR" ? e.amt : e.amt * (S.settings.rate || 0.87); }
function expList(){ return Object.entries(S.expenses).map(([id,e]) => ({id, ...e})).sort((a,b) => (b.created||0) - (a.created||0)); }
function sumEur(list){ return list.reduce((s,e) => s + expEur(e), 0); }

function render(){
  $("#hello").textContent = S.name ? `Bok, ${S.name} · 5. – 14. 12. 2026` : "Putni pratilac · 5. – 14. 12. 2026";
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  $("#fab").classList.toggle("hidden", !(tab === "troskovi" || tab === "danas"));
  const v = $("#view");
  const banner = S.note ? `<div class="banner">${esc(S.note)}</div>` : "";
  v.innerHTML = banner + ({danas:vDanas, plan:vPlan, troskovi:vTroskovi, popisi:vPopisi, info:vInfo}[tab])();
}

function timeline(day, nowH, interactive=true){
  let cur = -1;
  if (nowH != null) day.items.forEach((it,i) => { if (it.h <= nowH) cur = i; });
  return `<ul class="tl">${day.items.map((it,i) => {
    const key = `${day.id}#${i}`, done = !!S.checks[key];
    const cls = [done?"done":"", nowH!=null && i===cur ? "now" : "", nowH!=null && i<cur && !done ? "past":""].join(" ");
    return `<li class="${cls}"><div class="time">${esc(it.t)}</div><div class="txt"><span class="t">${esc(it.x)}</span>${it.s?`<small>${esc(it.s)}</small>`:""}</div>${interactive?`<button class="chk ${done?"on":""}" data-check="${esc(key)}" aria-label="Označi"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></button>`:""}</li>`;
  }).join("")}</ul>`;
}
function blocks(day){
  return day.blocks.map(b => {
    if (b.k === "tip") return `<div class="tip">${esc(b.x)}</div>`;
    if (b.k === "links") return `<div class="row" style="flex-wrap:wrap;gap:8px;margin:10px 0">${b.l.map(([n,u]) => `<a class="btn sm" href="${esc(u)}" target="_blank" rel="noopener">↗ ${esc(n)}</a>`).join("")}</div>`;
    if (b.k === "places") return `<div class="card"><div class="sec-title" style="margin-top:0">${esc(b.title)}</div>${b.l.map(([n,d]) => `<div class="place"><b>${esc(n)}</b><p>${esc(d)}</p></div>`).join("")}</div>`;
    if (b.k === "opts") return `<div class="card"><div class="sec-title" style="margin-top:0">${esc(b.title)}</div>${b.l.map(([n,d]) => `<div class="opt"><b>${esc(n)}</b><p>${esc(d)}</p></div>`).join("")}</div>`;
    return "";
  }).join("");
}

function vDanas(){
  const T = tripKey();
  let html = "";
  if (T.k === "pre"){
    const start = Date.UTC(2026,11,5,13,55); // 14:55 Zagreb
    const diff = Math.max(0, start - Date.now());
    const d = Math.floor(diff/864e5), h = Math.floor(diff%864e5/36e5), m = Math.floor(diff%36e5/6e4);
    const preItems = allListItems("pre"), preDone = preItems.filter(i => S.checks["pre:"+i.id]).length;
    const packItems = allListItems("pack"), packDone = packItems.filter(i => S.checks["pack:"+i.id]).length;
    html += `<div class="card dark"><div class="eyebrow">Do polaska</div><h2 style="margin-top:4px">Subota, 5. prosinca u 14:55</h2>
      <div class="countdown"><div><b>${d}</b><span>DANA</span></div><div><b>${h}</b><span>SATI</span></div><div><b>${m}</b><span>MINUTA</span></div></div></div>
      <div class="card"><div class="row between"><h3>Pripreme</h3><button class="btn sm" data-go="popisi">Otvori popise</button></div>
      <div class="cat-row"><div class="row between"><span>Prije puta</span><span class="muted">${preDone} / ${preItems.length}</span></div><div class="bar"><i style="width:${preItems.length?preDone/preItems.length*100:0}%"></i></div></div>
      <div class="cat-row"><div class="row between"><span>Pakiranje</span><span class="muted">${packDone} / ${packItems.length}</span></div><div class="bar"><i style="width:${packItems.length?packDone/packItems.length*100:0}%"></i></div></div></div>`;
    const next = preItems.filter(i => !S.checks["pre:"+i.id]).slice(0,4);
    if (next.length) html += `<div class="card"><div class="sec-title" style="margin-top:0">Još treba obaviti</div>${next.map(i => listRow("pre", i)).join("")}</div>`;
    const pre = expList().filter(e => e.day === "pre");
    html += `<div class="card"><div class="row between"><div><div class="muted">Plaćeno prije puta</div><div class="big" style="font-size:28px;margin-top:4px">${eur(sumEur(pre))}</div></div><button class="btn solid sm" data-add="pre">+ Dodaj</button></div></div>`;
    html += `<div class="sec-title">Prvi dan</div>` + dayCard(DAYS[0], null, true);
    return html;
  }
  if (T.k === "post"){
    const all = expList();
    return `<div class="card dark"><div class="eyebrow">Putovanje je završeno</div><h2 style="margin-top:6px">Dobrodošli kući!</h2><p class="muted">Ukupno potrošeno tijekom puta: <b style="color:#fff">${eur(sumEur(all))}</b></p><button class="btn" data-go="troskovi">Pregled troškova</button></div>`;
  }
  const day = dayById(T.k);
  const todays = expList().filter(e => e.day === day.id);
  html += `<div class="card dark"><div class="row" style="align-items:flex-end;gap:14px"><div class="daynum">${day.n === 0 || day.n === 9 ? "✈" : day.n}</div><div class="grow"><div class="eyebrow">${esc(day.dow)}, ${esc(day.d)}${day.n>0&&day.n<9?" · dan "+day.n:""}</div><h2 style="margin-top:4px">${esc(day.title)}</h2></div></div><p class="muted" style="margin:10px 0 0">${esc(day.sub)}</p></div>`;
  html += `<div class="card">${timeline(day, T.h)}</div>`;
  html += `<div class="card"><div class="row between"><div><div class="muted">Danas potrošeno</div><div class="big" style="font-size:28px;margin-top:4px">${eur(sumEur(todays))}</div><div class="muted small">${todays.length} ${todays.length===1?"stavka":"stavki"}</div></div><button class="btn solid" data-add="${day.id}">+ Trošak</button></div>
    ${todays.slice(0,4).map(expRow).join("")}</div>`;
  html += blocks(day);
  return html;
}
function dayCard(day, nowH, compact){
  return `<div class="card"><div class="eyebrow gold">${esc(day.dow)}, ${esc(day.d)}</div><h2 style="margin:4px 0 2px">${esc(day.title)}</h2><p class="muted" style="margin:0 0 6px">${esc(day.sub)}</p>${timeline(day, nowH)}</div>` + (compact ? "" : blocks(day));
}

function vPlan(){
  const T = tripKey();
  if (!planDay) planDay = dayById(T.k) ? T.k : DAYS[1].id;
  const day = dayById(planDay);
  const chips = DAYS.map(d => `<button class="chip ${d.id===planDay?"on":""} ${d.id===T.k?"today":""}" data-day="${d.id}"><small>${d.n===0||d.n===9?"let":"dan "+d.n}</small><b>${d.d.replace(". 12.",".")}</b></button>`).join("");
  const done = day.items.filter((_,i) => S.checks[`${day.id}#${i}`]).length;
  return `<div class="chips">${chips}</div>
    <div class="card dark"><div class="row" style="align-items:flex-end;gap:14px"><div class="daynum">${day.n===0||day.n===9?"✈":day.n}</div><div class="grow"><div class="eyebrow">${esc(day.dow)}, ${esc(day.d)}</div><h2 style="margin-top:4px">${esc(day.title)}</h2></div></div><p class="muted" style="margin:10px 0 0">${esc(day.sub)} · obavljeno ${done}/${day.items.length}</p></div>
    <div class="card">${timeline(day, day.id===T.k ? T.h : null)}</div>${blocks(day)}`;
}

function expRow(e){
  const c = CATS.find(c => c.id === e.cat) || CATS[5];
  const icon = e.receipt ? `<img class="thumb" src="${esc(receiptSrc(e.receipt))}" alt="">` : `<div class="ico">${c.e}</div>`;
  const main = e.cur === "EUR" ? eur(e.amt) : usd(e.amt);
  const sub = e.cur === "EUR" ? "" : "≈ " + eur(expEur(e));
  return `<button class="exp" data-edit="${esc(e.id)}">${icon}<div class="grow"><div>${esc(e.desc || c.n)}</div><div class="muted small">${esc(c.n)}${e.pay==="cash"?" · gotovina":""}${e.receipt?" · 📎 račun":""}</div></div><div class="amt"><b>${main}</b><small>${sub}</small></div></button>`;
}
function vTroskovi(){
  const all = expList(), st = S.settings, rate = st.rate || 0.87;
  const total = sumEur(all);
  const budgetTotal = Object.values(st.budgets).reduce((a,b) => a + (+b||0), 0);
  const byCat = CATS.map(c => ({...c, s: sumEur(all.filter(e => e.cat === c.id)), b: +st.budgets[c.id] || 0}));
  let html = `<div class="card dark"><div class="eyebrow">Ukupno potrošeno</div><div class="big" style="margin:6px 0 2px">${eur(total)}</div>
    <div class="muted">${budgetTotal ? `od planiranih ${eur(budgetTotal)} · ostaje <b style="color:${total>budgetTotal?"#E59A8C":"#fff"}">${eur(budgetTotal-total)}</b>` : "Postavite budžet u Info → Postavke"}</div>
    ${budgetTotal ? `<div class="bar" style="margin-top:10px"><i class="${total>budgetTotal?"over":""}" style="width:${Math.min(100,total/budgetTotal*100)}%"></i></div>` : ""}
    <p class="muted small" style="margin:10px 0 0">Tečaj 1 $ = ${fmt(rate,3)} € · letovi i hoteli (1.363,43 € po osobi) već su plaćeni i nisu ovdje</p></div>`;
  html += `<div class="card"><div class="sec-title" style="margin-top:0">Po kategorijama</div>${byCat.filter(c => c.s>0 || c.b>0).map(c => `
    <div class="cat-row"><div class="row between"><span>${c.e} ${esc(c.n)}</span><span class="muted">${eur(c.s)}${c.b?` / ${fmt(c.b,0)} €`:""}</span></div>${c.b?`<div class="bar"><i class="${c.s>c.b?"over":""}" style="width:${Math.min(100,c.s/c.b*100)}%"></i></div>`:""}</div>`).join("") || `<div class="empty">Još nema troškova.</div>`}</div>`;
  const ids = ["all","pre",...DAYS.map(d => d.id)];
  const T = tripKey();
  html += `<div class="chips">${ids.map(id => {
    const d = dayById(id); const s = id==="all" ? total : sumEur(all.filter(e => e.day===id));
    return `<button class="chip ${costDay===id?"on":""} ${id===T.k?"today":""}" data-cday="${id}"><small>${id==="all"?"sve":id==="pre"?"prije":d.d.replace(". 12.",".")}</small><b>${s?fmt(s,0)+" €":"–"}</b></button>`;
  }).join("")}</div>`;
  const groups = costDay === "all" ? ["pre",...DAYS.map(d=>d.id)] : [costDay];
  let any = false;
  groups.forEach(g => {
    const l = all.filter(e => e.day === g);
    if (!l.length && costDay === "all") return;
    any = true;
    const usdSum = l.filter(e => e.cur !== "EUR").reduce((s,e)=>s+e.amt,0);
    html += `<div class="card"><div class="row between" style="margin-bottom:4px"><h3>${esc(dayLabel(g))}</h3><div class="amt"><b>${eur(sumEur(l))}</b>${usdSum?`<small>${usd(usdSum)} u dolarima</small>`:""}</div></div>
      ${l.map(expRow).join("") || `<div class="empty">Nema troškova za ovaj dan.</div>`}
      <button class="btn sm block" style="margin-top:8px" data-add="${g}">+ Dodaj trošak za ${g==="pre"?"pripreme":esc(dayById(g).d)}</button></div>`;
  });
  if (!any) html += `<div class="card empty">Još nema unesenih troškova.<br>Dodajte prvi gumbom <b>+</b> – možete i slikati račun.</div>`;
  return html;
}

function allListItems(list){
  const base = LISTS[list].items.map(([id,x]) => ({id, x, base:true}));
  const custom = Object.entries(S.items).filter(([,v]) => v.list === list).sort((a,b)=>(a[1].created||0)-(b[1].created||0)).map(([id,v]) => ({id, x:v.text}));
  return base.concat(custom);
}
function listRow(list, i){
  const k = list + ":" + i.id, on = !!S.checks[k];
  return `<div class="li ${on?"done":""}"><button class="chk ${on?"on":""}" data-check="${esc(k)}" aria-label="Označi"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></button><div class="grow txt"><span class="t">${esc(i.x)}</span></div>${i.base?"":`<button class="x" data-delitem="${esc(i.id)}" aria-label="Obriši">×</button>`}</div>`;
}
function vPopisi(){
  const seg = `<div class="seg" style="margin-bottom:14px">${[["pre","Prije puta"],["pack","Pakiranje"],["shop","Shopping"]].map(([k,n]) => `<button class="${listTab===k?"on":""}" data-ltab="${k}">${n}</button>`).join("")}</div>`;
  if (listTab === "shop"){
    const items = Object.entries(S.shopping).map(([id,v]) => ({id,...v})).sort((a,b) => (a.done?1:0)-(b.done?1:0) || (a.created||0)-(b.created||0));
    const left = items.filter(i => !i.done).length;
    return seg + `<div class="card"><div class="row between"><h3>Što želim kupiti</h3><span class="progress">${left} preostalo</span></div>
      ${items.map(i => `<div class="li ${i.done?"done":""}"><button class="chk ${i.done?"on":""}" data-shop="${esc(i.id)}"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></button><div class="grow txt"><span class="t">${esc(i.text)}</span>${i.where?`<small>📍 ${esc(i.where)}</small>`:""}</div><button class="x" data-delshop="${esc(i.id)}" aria-label="Obriši">×</button></div>`).join("") || `<div class="empty">Popis je prazan.</div>`}
      <form id="shopForm"><div class="addrow"><input class="inp" id="shopText" placeholder="Npr. tenisice, poklon za…" autocomplete="off"></div>
      <div class="addrow"><input class="inp" id="shopWhere" placeholder="Gdje (po želji)" autocomplete="off" list="shopsList"><button class="btn solid" type="submit">Dodaj</button></div>
      <datalist id="shopsList">${SHOPS.map(s => `<option value="${esc(s)}">`).join("")}</datalist></form></div>
      <div class="card"><div class="sec-title" style="margin-top:0">Iz brošure</div>
      <div class="place"><b>Marshalls, 2nd STREET, Goodwill, TTH Vintage</b><p>Chelsea i Flatiron, srijeda popodne (dan 4).</p></div>
      <div class="place"><b>Macy's</b><p>Herald Square, ponedjeljak (dan 2).</p></div>
      <div class="place"><b>The Shops at Hudson Yards · Grand Slam</b><p>Četvrtak (dan 5).</p></div>
      <div class="place"><b>Blagdanski sajmovi</b><p>Union Square i Columbus Circle, subota (dan 7).</p></div>
      <div class="place"><b>The Mills at Jersey Gardens</b><p>Nedjelja (dan 8) – bez poreza na odjeću i obuću.</p></div>
      <div class="tip">Na Manhattanu se odjeća i obuća ispod $110 po komadu ne oporezuju.</div></div>`;
  }
  const items = allListItems(listTab), done = items.filter(i => S.checks[listTab+":"+i.id]).length;
  return seg + `<div class="card"><div class="row between"><h3>${LISTS[listTab].n}</h3><span class="progress">${done} / ${items.length}</span></div>
    <div class="bar" style="margin:8px 0 6px"><i style="width:${items.length?done/items.length*100:0}%"></i></div>
    ${items.map(i => listRow(listTab, i)).join("")}
    <form id="itemForm"><div class="addrow"><input class="inp" id="itemText" placeholder="Dodaj stavku…" autocomplete="off"><button class="btn solid" type="submit">Dodaj</button></div></form></div>`;
}

function flight(lbl, t1, a1, t2, a2, plus){
  return `<div class="flight"><div><div class="muted small">${esc(lbl)}</div><div class="row"><div><div class="t">${t1}</div><div class="muted small">${a1}</div></div></div></div><div class="ln"></div><div style="text-align:right"><div class="muted small">&nbsp;</div><div class="t">${t2}${plus?`<sup class="small gold"> ${plus}</sup>`:""}</div><div class="muted small">${a2}</div></div></div>`;
}

/* ================= OBRAZAC ZA TROŠAK ================= */
let F = null;
function openExpense(id, day){
  const T = tripKey();
  if (id){ const e = S.expenses[id]; F = {id, ...JSON.parse(JSON.stringify(e)), amtStr: String(e.amt).replace(".", ","), newFile:null, preview: receiptSrc(e.receipt)}; }
  else {
    const dd = day || (T.k === "post" ? "2026-12-14" : T.k);
    F = {id:null, day:dd, cur: (dd==="pre"||dd==="2026-12-05"||dd==="2026-12-14") ? "EUR" : "USD", cat:"hrana", desc:"", pay:"card", amtStr:"", receipt:null, newFile:null, preview:""};
  }
  drawSheet(); $("#sheetWrap").classList.add("open");
  if (!id) setTimeout(() => $("#fAmt")?.focus(), 250);
}
function drawSheet(){
  const dayOpts = [["pre","Prije puta"], ...DAYS.map(d => [d.id, `${d.dow}, ${d.d}`])];
  const n = parseNum(F.amtStr);
  const conv = isFinite(n) && F.cur === "USD" ? `≈ ${eur(n * (S.settings.rate||0.87))}` : "";
  $("#sheet").innerHTML = `<div class="handle"></div>
    <div class="row between"><h2>${F.id?"Uredi trošak":"Novi trošak"}</h2><button class="btn sm" data-close>Zatvori</button></div>
    <label class="f">Iznos</label>
    <div class="row"><input class="inp amount-inp grow" id="fAmt" inputmode="decimal" placeholder="0,00" value="${esc(F.amtStr)}"><div class="seg" style="width:120px"><button type="button" class="${F.cur==="USD"?"on":""}" data-cur="USD">$</button><button type="button" class="${F.cur==="EUR"?"on":""}" data-cur="EUR">€</button></div></div>
    <div class="row between" style="margin-top:6px"><span class="muted small" id="fConv">${conv}</span></div>
    <div class="quick"><button type="button" class="btn sm" data-q="1.089">+ porez 8,9 %</button><button type="button" class="btn sm" data-q="1.18">+ napojnica 18 %</button><button type="button" class="btn sm" data-q="1.20">+ napojnica 20 %</button></div>
    <label class="f">Kategorija</label>
    <div class="catgrid">${CATS.map(c => `<button type="button" class="${F.cat===c.id?"on":""}" data-cat="${c.id}"><span>${c.e}</span>${esc(c.n)}</button>`).join("")}</div>
    <label class="f">Opis</label><input class="inp" id="fDesc" placeholder="npr. Ručak u Wo Hopu" value="${esc(F.desc)}" autocomplete="off">
    <label class="f">Dan</label><select class="inp" id="fDay">${dayOpts.map(([v,l]) => `<option value="${v}" ${F.day===v?"selected":""}>${esc(l)}</option>`).join("")}</select>
    <label class="f">Plaćanje</label><div class="seg"><button type="button" class="${F.pay==="card"?"on":""}" data-pay="card">Kartica</button><button type="button" class="${F.pay==="cash"?"on":""}" data-pay="cash">Gotovina</button></div>
    <label class="f">Račun</label>
    ${F.preview ? `<div class="photo-prev"><img src="${esc(F.preview)}" alt="Račun"><button type="button" class="btn sm navy" data-rmphoto>Ukloni</button></div>` :
      `<div class="row"><button type="button" class="btn grow" data-photo="cam">📷 Slikaj račun</button><button type="button" class="btn grow" data-photo="gal">🖼 Iz galerije</button></div>`}
    <button class="btn solid block" id="fSave" style="margin-top:18px;padding:13px">${F.id?"Spremi promjene":"Spremi trošak"}</button>
    ${F.id?`<button class="btn danger block" id="fDel" style="margin-top:10px">Obriši trošak</button>`:""}`;
}
function closeSheet(){ if (!F) return; $("#sheetWrap").classList.remove("open"); if (F && F.newFile && F.preview.startsWith("blob:")) URL.revokeObjectURL(F.preview); F = null; }
function syncForm(){ if (!F) return; const a=$("#fAmt"), d=$("#fDesc"), dy=$("#fDay"); if(a) F.amtStr=a.value; if(d) F.desc=d.value; if(dy) F.day=dy.value; }
async function saveExpense(){
  syncForm();
  const amt = parseNum(F.amtStr);
  if (!isFinite(amt) || amt <= 0){ toast("Upišite iznos."); $("#fAmt")?.focus(); return; }
  const btn = $("#fSave"); btn.disabled = true; btn.textContent = F.newFile ? "Spremam sliku…" : "Spremam…";
  let receipt = F.receipt || null;
  try{
    if (F.newFile) receipt = await storeReceipt(F.newFile);
  }catch(e){ console.warn(e); toast("Slika se nije spremila – trošak spremam bez nje."); receipt = F.receipt || null; }
  const old = F.id ? S.expenses[F.id] : null;
  if (old && old.receipt && (!receipt || receipt.local !== old.receipt.local)) removeReceipt(old.receipt);
  const id = F.id || uid();
  const data = {amt: Math.round(amt*100)/100, cur:F.cur, cat:F.cat, desc:F.desc.trim(), day:F.day, pay:F.pay, created: old?.created || Date.now()};
  if (receipt) data.receipt = receipt;
  closeSheet();
  try { await putDoc("expenses", id, data); toast(old ? "Trošak je ažuriran" : "Trošak je spremljen"); } catch(e){}
}
async function deleteExpense(){
  const e = S.expenses[F.id];
  const btn = $("#fDel");
  if (btn.dataset.sure !== "1"){ btn.dataset.sure = "1"; btn.textContent = "Dodirnite ponovno za brisanje"; return; }
  if (e && e.receipt) removeReceipt(e.receipt);
  const id = F.id; closeSheet(); await delDoc("expenses", id); toast("Trošak je obrisan");
}

/* ================= DOGAĐAJI ================= */
document.addEventListener("click", ev => {
  const t = ev.target.closest("button, a"); if (!t) { if (ev.target.id === "sheetWrap") closeSheet(); return; }
  const ds = t.dataset;
  if (ds.tab) return setTab(ds.tab);
  if (ds.go) return setTab(ds.go);
  if (ds.check) return toggleCheck(ds.check);
  if (ds.day){ planDay = ds.day; return render(); }
  if (ds.cday){ costDay = ds.cday; return render(); }
  if (ds.ltab){ listTab = ds.ltab; return render(); }
  if (ds.add != null) return openExpense(null, ds.add);
  if (ds.edit) return openExpense(ds.edit);
  if (ds.delitem){ const id = ds.delitem; delDoc("items", id); delDoc("checks", listTab+":"+id); return; }
  if (ds.shop){ const it = S.shopping[ds.shop]; return putDoc("shopping", ds.shop, {...it, done:!it.done}).catch(()=>{}); }
  if (ds.delshop) return delDoc("shopping", ds.delshop);
  // obrazac
  if (!F) return;
  if (ds.close != null) return closeSheet();
  if (ds.cur){ syncForm(); F.cur = ds.cur; return drawSheet(); }
  if (ds.cat){ syncForm(); F.cat = ds.cat; return drawSheet(); }
  if (ds.pay){ syncForm(); F.pay = ds.pay; return drawSheet(); }
  if (ds.q){ syncForm(); const n = parseNum(F.amtStr); if (isFinite(n)){ F.amtStr = fmt(n * parseFloat(ds.q)).replace(/\./g,""); drawSheet(); } else toast("Prvo upišite iznos."); return; }
  if (ds.photo){ syncForm(); const inp = ds.photo === "cam" ? $("#fileCam") : $("#fileGal"); inp.value = ""; inp.click(); return; }
  if (ds.rmphoto != null){ syncForm(); F.receipt = null; F.newFile = null; F.preview = ""; return drawSheet(); }
  if (t.id === "fSave") return saveExpense();
  if (t.id === "fDel") return deleteExpense();
});
$("#fab").addEventListener("click", () => openExpense(null, tab === "troskovi" && costDay !== "all" ? costDay : null));
$("#sheetWrap").addEventListener("click", e => { if (e.target.id === "sheetWrap") closeSheet(); });
["#fileCam","#fileGal"].forEach(s => $(s).addEventListener("change", e => {
  const f = e.target.files && e.target.files[0]; if (!f || !F) return;
  syncForm(); F.newFile = f; F.preview = URL.createObjectURL(f); drawSheet();
}));
document.addEventListener("input", e => {
  if (e.target.id === "fAmt" && F){ F.amtStr = e.target.value; const n = parseNum(F.amtStr); $("#fConv").textContent = isFinite(n) && F.cur==="USD" ? `≈ ${eur(n*(S.settings.rate||0.87))}` : ""; }
  if (e.target.id === "calcIn"){
    const n = parseNum(e.target.value), r = S.settings.rate || 0.87, o = $("#calcOut");
    if (!isFinite(n)){ o.innerHTML = ""; return; }
    o.innerHTML = `<dt>U eurima</dt><dd>${eur(n*r)}</dd><dt>+ porez 8,9 %</dt><dd>${usd(n*1.089)} · ${eur(n*1.089*r)}</dd><dt>Napojnica 18 %</dt><dd>${usd(n*.18)} → ukupno ${usd(n*1.18)}</dd><dt>Napojnica 20 %</dt><dd>${usd(n*.2)} → ukupno ${usd(n*1.2)}</dd>`;
  }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "itemForm"){ const v = $("#itemText").value.trim(); if (!v) return; putDoc("items", uid(), {list:listTab, text:v, created:Date.now()}).catch(()=>{}); }
  if (e.target.id === "shopForm"){ const v = $("#shopText").value.trim(); if (!v) return; putDoc("shopping", uid(), {text:v, where:$("#shopWhere").value.trim(), done:false, created:Date.now()}).catch(()=>{}); }
  if (e.target.id === "nameForm"){ const v = $("#nameInp").value.trim(); if (!v) return; S.name = v; LS.set("name", v); render(); toast("Ime je spremljeno"); return; }
  if (e.target.id === "welcomeForm"){ const v = $("#welcomeName").value.trim(); if (!v){ $("#welcomeName").focus(); return; } S.name = v; LS.set("name", v); $("#sheetWrap").classList.remove("open"); render(); toast(`Bok, ${v}!`); return; }
  if (e.target.id === "setForm"){
    const r = parseNum($("#setRate").value); if (!isFinite(r) || r <= 0){ toast("Neispravan tečaj."); return; }
    const b = {}; document.querySelectorAll("[data-bud]").forEach(i => { const n = parseNum(i.value); b[i.dataset.bud] = isFinite(n) ? n : 0; });
    saveSettings({rate:r, budgets:b}); toast("Postavke su spremljene");
  }
});
document.addEventListener("click", e => { const im = e.target.closest(".photo-prev img"); if (im){ $("#viewerImg").src = im.src; $("#viewer").classList.add("open"); } });
document.addEventListener("click", e => {
  if (e.target.id === "bkExport") exportBackup();
  if (e.target.id === "bkImport") $("#bkFile").click();
});
document.addEventListener("change", e => { if (e.target.id === "bkFile" && e.target.files[0]){ importBackup(e.target.files[0]); e.target.value = ""; } });
/* ================= INSTALACIJA ================= */
let installEvt = null, installOpen = false;
const UA = navigator.userAgent;
const isIOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isAndroid = /Android/.test(UA);
const inAppBrowser = /FBAN|FBAV|FB_IAB|Instagram|Line\/|Snapchat|; wv\)/.test(UA);
function isStandalone(){ return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true; }
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (installOpen) showInstall(); });
window.addEventListener("appinstalled", () => { installEvt = null; LS.set("installSkip", true); if (installOpen) showInstall("done"); });
const SHARE_IC = `<svg viewBox="0 0 24 24" width="18" height="18" style="vertical-align:-3px;stroke:var(--navy);fill:none;stroke-width:1.8"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5v10h14V11h-1"/></svg>`;
function step(n, html){ return `<div class="row" style="align-items:flex-start;margin-top:12px"><div style="width:28px;height:28px;border-radius:50%;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;flex:none;font-size:14px">${n}</div><div class="grow" style="padding-top:3px">${html}</div></div>`; }
function showInstall(state){
  installOpen = true;
  let body;
  if (state === "done"){
    body = `<h2 style="margin:6px 0 8px">Instalirano!</h2><p class="muted">Zatvori preglednik i otvori <b>New York</b> s početnog zaslona. Tamo upiši svoje ime i kreni.</p>`;
  } else if (inAppBrowser){
    body = `<h2 style="margin:6px 0 8px">Otvori u pregledniku</h2><p class="muted">Link je otvoren unutar druge aplikacije, pa se odavde ne može instalirati.</p>
      ${step(1, `Dodirni izbornik <b>⋮</b> ili <b>…</b> u kutu`)}${step(2, `Odaberi <b>Otvori u pregledniku</b> (${isIOS ? "Safari" : "Chrome"})`)}${step(3, "Tamo će se ponuditi instalacija")}`;
  } else if (installEvt){
    body = `<h2 style="margin:6px 0 8px">Instaliraj aplikaciju</h2><p class="muted">Dodaj New York na početni zaslon – otvara se kao prava aplikacija, a plan i troškovi rade i bez interneta.</p>
      <button class="btn solid block" id="doInstall" style="margin-top:14px;padding:14px;font-size:16px">⤓ Instaliraj</button>`;
  } else if (isIOS){
    body = `<h2 style="margin:6px 0 8px">Dodaj na početni zaslon</h2><p class="muted">Tako se New York otvara kao prava aplikacija i radi bez interneta.</p>
      ${step(1, `Dodirni ikonu <b>Dijeli</b> ${SHARE_IC} na dnu ili vrhu Safarija`)}${step(2, `Pomakni se dolje i odaberi <b>Dodaj na početni zaslon</b>`)}${step(3, `Dodirni <b>Dodaj</b>, pa otvori New York s početnog zaslona`)}
      <div class="tip">Otvori aplikaciju s početnog zaslona prije unosa podataka – ono što upišeš ovdje u Safariju ostaje samo u Safariju.</div>`;
  } else if (isAndroid){
    body = `<h2 style="margin:6px 0 8px">Instaliraj aplikaciju</h2><p class="muted">Tako se New York otvara kao prava aplikacija i radi bez interneta.</p>
      ${step(1, `Dodirni izbornik <b>⋮</b> gore desno u Chromeu`)}${step(2, `Odaberi <b>Instaliraj aplikaciju</b> ili <b>Dodaj na početni zaslon</b>`)}${step(3, `Potvrdi, pa otvori New York s početnog zaslona`)}
      <p class="muted small" style="margin-top:12px">Ako koristiš Samsung Internet: izbornik ☰ → <b>Dodaj stranicu na</b> → <b>Početni zaslon</b>.</p>`;
  } else {
    body = `<h2 style="margin:6px 0 8px">Najbolje na mobitelu</h2><p class="muted">Aplikacija je napravljena za mobitel. Pošalji si link i otvori ga na mobitelu, tamo je možeš dodati na početni zaslon. Može se koristiti i ovdje u pregledniku.</p>`;
  }
  $("#sheet").innerHTML = `<div class="handle"></div><div class="eyebrow gold">New York · 5. – 14. 12. 2026</div>${body}
    <button class="btn block" id="skipInstall" style="margin-top:16px;border-color:var(--line2);color:var(--slate)">${state === "done" ? "Nastavi ovdje u pregledniku" : "Nastavi u pregledniku"}</button>`;
  $("#sheetWrap").classList.add("open");
}
document.addEventListener("click", async e => {
  if (e.target.id === "openInstall") showInstall();
  if (e.target.id === "doInstall" && installEvt){
    const ev = installEvt; installEvt = null;
    ev.prompt();
    try { const r = await ev.userChoice; if (r.outcome === "accepted") showInstall("done"); else showInstall(); } catch(_){ showInstall(); }
  }
  if (e.target.id === "skipInstall"){
    installOpen = false; LS.set("installSkip", true);
    $("#sheetWrap").classList.remove("open");
    if (!S.name) setTimeout(askName, 200);
  }
});

function askName(){
  $("#sheet").innerHTML = `<div class="handle"></div><div class="eyebrow gold">New York · 5. – 14. 12. 2026</div><h2 style="margin:6px 0 8px">Dobro došli!</h2>
    <p class="muted" style="margin:0 0 6px">Ovo je tvoj putni pratilac: plan po danima, troškovi sa slikama računa i popisi. Sve što uneseš ostaje samo na ovom uređaju.</p>
    <form id="welcomeForm"><label class="f">Kako se zoveš?</label><input class="inp" id="welcomeName" autocomplete="given-name" placeholder="Ime">
    <button class="btn solid block" type="submit" style="margin-top:16px;padding:13px">Kreni</button></form>`;
  $("#sheetWrap").classList.add("open");
  setTimeout(() => $("#welcomeName")?.focus(), 250);
}
$("#viewerClose").addEventListener("click", () => $("#viewer").classList.remove("open"));

function tick(){ $("#clkZg").textContent = tzParts("Europe/Zagreb").hm; $("#clkNy").textContent = tzParts("America/New_York").hm; }
tick(); setInterval(() => { tick(); if (tab === "danas" && !F) render(); }, 60000);

const h0 = location.hash.slice(1); if (["danas","plan","troskovi","popisi","info"].includes(h0)) tab = h0;
render();
loadReceipts();
if (!isStandalone() && !LS.get("installSkip", false)) showInstall();
else if (!S.name) askName();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
